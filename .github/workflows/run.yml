name: HEBAT Auto Upload Tugas

on:
  schedule:
    - cron: '0 0 * * 2' # Setiap Selasa jam 07:00 WIB
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright python-dotenv
        playwright install chromium

    - name: Run Bot Upload
      env:
        HEBAT_USERNAME: ${{ secrets.HEBAT_USERNAME }}
        HEBAT_PASSWORD: ${{ secrets.HEBAT_PASSWORD }}
        HEBAT_URL_MATKUL: ${{ secrets.HEBAT_URL_MATKUL }}
        HEBAT_NAMA_TUGAS: ${{ secrets.HEBAT_NAMA_TUGAS }}
        HEBAT_FILE_TUGAS: ${{ secrets.HEBAT_FILE_TUGAS }}
      run: |
        python hebat_bot_upload.py