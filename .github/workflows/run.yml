name: HEBAT Auto Upload Tugas

on:
  schedule:
    # Jadwal dalam format UTC (Waktu Indonesia Barat / WIB adalah UTC+7)
    # Jam 07:00 WIB sama dengan jam 00:00 UTC setiap hari Selasa
    - cron: '0 0 * * 2'
  workflow_dispatch: # Memungkinkan kamu menjalankan bot secara manual kapan saja dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright python-dotenv
        playwright install chromium

    - name: Run Bot Upload
      env:
        HEBAT_USERNAME: ${{ secrets.HEBAT_USERNAME }}
        HEBAT_PASSWORD: ${{ secrets.HEBAT_PASSWORD }}
      run: |
        python hebat_bot_upload.py